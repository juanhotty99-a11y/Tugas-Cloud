<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Mahasiswa</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f3f4f6; color: #111827; }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .info { font-size: 0.85rem; color: #4b5563; margin-bottom: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
    button { padding: 10px 14px; border: 0; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
    .btn-primary { background: #2563eb; color: #fff; width: 100%; }
    .btn-secondary { background: #e5e7eb; width: 100%; margin-top: 6px; }
    .btn-edit { background: #f59e0b; color: #fff; }
    .btn-hapus { background: #dc2626; color: #fff; }
    .item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
    .item:last-child { border-bottom: 0; }
    .item small { color: #6b7280; }
    .aksi { display: flex; gap: 6px; flex-shrink: 0; }
    .kosong { color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Data Mahasiswa</h1>
    <div class="info" id="info">Memuat info koneksi...</div>

    <div class="card">
      <form id="form">
        <input type="hidden" id="id">
        <input id="nim" placeholder="NIM" required>
        <input id="nama" placeholder="Nama" required>
        <input id="jurusan" placeholder="Jurusan" required>
        <button type="submit" class="btn-primary" id="btnSimpan">Tambah</button>
        <button type="button" class="btn-secondary" id="btnBatal" hidden>Batal Edit</button>
      </form>
    </div>

    <div class="card">
      <div id="list"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const list = document.getElementById('list');
    const fields = ['id', 'nim', 'nama', 'jurusan'].reduce((o, k) => (o[k] = document.getElementById(k), o), {});
    const btnSimpan = document.getElementById('btnSimpan');
    const btnBatal = document.getElementById('btnBatal');

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadInfo() {
      const res = await fetch('/api/info');
      const data = await res.json();
      document.getElementById('info').textContent =
        `IP perangkat kamu: ${data.ipKamu} | IP server (laptop): ${data.ipServer.join(', ')}`;
    }

    let dataCache = {};

    async function loadData() {
      const res = await fetch('/api/mahasiswa');
      const data = await res.json();
      dataCache = Object.fromEntries(data.map((m) => [m.id, m]));
      if (!data.length) {
        list.innerHTML = '<p class="kosong">Belum ada data</p>';
        return;
      }
      list.innerHTML = data.map((m) => `
        <div class="item">
          <div>
            <strong>${escapeHtml(m.nama)}</strong><br>
            <small>${escapeHtml(m.nim)} &middot; ${escapeHtml(m.jurusan)}</small>
          </div>
          <div class="aksi">
            <button class="btn-edit" onclick="mulaiEdit(${m.id})">Edit</button>
            <button class="btn-hapus" onclick="hapus(${m.id})">Hapus</button>
          </div>
        </div>`).join('');
    }

    function mulaiEdit(id) {
      const m = dataCache[id];
      fields.id.value = m.id;
      fields.nim.value = m.nim;
      fields.nama.value = m.nama;
      fields.jurusan.value = m.jurusan;
      btnSimpan.textContent = 'Simpan Perubahan';
      btnBatal.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      form.reset();
      fields.id.value = '';
      btnSimpan.textContent = 'Tambah';
      btnBatal.hidden = true;
    }

    async function hapus(id) {
      if (!confirm('Hapus data ini?')) return;
      await fetch(`/api/mahasiswa/${id}`, { method: 'DELETE' });
      loadData();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = { nim: fields.nim.value, nama: fields.nama.value, jurusan: fields.jurusan.value };
      const id = fields.id.value;
      const res = await fetch(id ? `/api/mahasiswa/${id}` : '/api/mahasiswa', {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        alert((await res.json()).error);
        return;
      }
      resetForm();
      loadData();
    });

    btnBatal.addEventListener('click', resetForm);

    loadInfo();
    loadData();
    // Auto-refresh tiap 3 detik: data yang ditambah dari device lain langsung muncul
    setInterval(loadData, 3000);
  </script>
</body>
</html>
